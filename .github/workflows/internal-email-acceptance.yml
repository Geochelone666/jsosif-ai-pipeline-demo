name: Internal email acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Default is preview; real delivery is only to the configured sender itself'
        type: choice
        default: PREVIEW
        options:
          - PREVIEW
          - SEND_ONE_TO_SELF

permissions:
  contents: write

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: jsosif-email-delivery
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Open the persisted archive
        run: python scripts/prepare_store.py ../report-store
      - name: Open the independent delivery ledger
        id: ledger
        run: python scripts/prepare_delivery_store.py ../delivery-store --archive ../report-store
      - name: Preview or explicitly send one acceptance digest to the sender
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          INTERNAL_EMAIL_CONFIRM: ${{ inputs.mode }}
        run: |
          MODE=()
          if [ "$INTERNAL_EMAIL_CONFIRM" = SEND_ONE_TO_SELF ]; then MODE=(--send --persist-git); fi
          python scripts/internal_email_check.py --store ../report-store --ledger-store ../delivery-store --preview-dir "$RUNNER_TEMP/internal-email-preview" "${MODE[@]}"
      - name: Back up hashed delivery state
        if: always() && steps.ledger.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: delivery-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ../delivery-store/state/deliveries.json
            ../delivery-store/state/migration.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove private message previews
        if: always()
        run: rm -rf "$RUNNER_TEMP/internal-email-preview"
