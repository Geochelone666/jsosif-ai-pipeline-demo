name: Offline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        python: ['3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=scripts python -m pytest --import-mode=importlib -q
      - name: Build an offline preview from existing historical reports
        run: |
          python scripts/import_history.py --reports reports --store "$RUNNER_TEMP/report-preview"
          python scripts/build_site.py --store "$RUNNER_TEMP/report-preview" --output site-preview
      - uses: actions/upload-artifact@v6
        with:
          name: research-site-preview-${{ matrix.python }}
          path: site-preview
          retention-days: 14
      - name: Build deterministic shared research evidence from historical fixtures
        run: |
          python scripts/shared_research_pack.py --store "$RUNNER_TEMP/report-preview" --as-of 2026-11-06 --boc-capture tests/fixtures/boc_fxusdcad_20261102_20261106.json --output "$RUNNER_TEMP/shared-evidence.json"
          python scripts/shared_research_pack.py --store "$RUNNER_TEMP/report-preview" --as-of 2026-11-06 --boc-capture tests/fixtures/boc_fxusdcad_20261102_20261106.json --format markdown --output "$RUNNER_TEMP/shared-evidence.md"
      - uses: actions/upload-artifact@v6
        with:
          name: shared-research-evidence-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/shared-evidence.json
            ${{ runner.temp }}/shared-evidence.md
          retention-days: 14
      - name: Build candidate benchmark review from explicitly synthetic offline prices
        run: python scripts/benchmark_review.py --capture tests/fixtures/benchmark_prices_synthetic --output "$RUNNER_TEMP/benchmark-review-synthetic"
      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-review-synthetic-${{ matrix.python }}
          path: ${{ runner.temp }}/benchmark-review-synthetic
          retention-days: 14
      - name: Verify shared benchmark cache without provider calls
        run: PYTHONPATH=scripts python tests/benchmark_cache_acceptance.py --cache "$RUNNER_TEMP/benchmark-cache-state" --output "$RUNNER_TEMP/benchmark-cache-acceptance"
      - uses: actions/upload-artifact@v6
        with:
          name: benchmark-cache-acceptance-${{ matrix.python }}
          path: ${{ runner.temp }}/benchmark-cache-acceptance
          retention-days: 14
      - name: Package source for reproducible PDF visual review
        run: tar -czf "$RUNNER_TEMP/research-source-review.tar.gz" scripts config requirements.lock requirements.txt
      - uses: actions/upload-artifact@v6
        with:
          name: research-source-review-${{ matrix.python }}
          path: ${{ runner.temp }}/research-source-review.tar.gz
          retention-days: 7

      - name: Build retrospective news evidence with explicit source gaps
        run: python scripts/news_evidence.py --store "$RUNNER_TEMP/report-preview" --as-of 2026-11-06 --output "$RUNNER_TEMP/news-evidence"
      - uses: actions/upload-artifact@v6
        with:
          name: news-evidence-${{ matrix.python }}
          path: ${{ runner.temp }}/news-evidence
          retention-days: 14

      - name: Build and validate standalone news review draft
        run: python scripts/news_review.py --store "$RUNNER_TEMP/report-preview" --as-of 2026-11-06 --output "$RUNNER_TEMP/news-review"
      - uses: actions/upload-artifact@v6
        with:
          name: news-review-draft-${{ matrix.python }}
          path: ${{ runner.temp }}/news-review
          retention-days: 14

      - name: Build a private scoped news draft from a fixed public fixture selection
        run: python scripts/news_review.py --store "$RUNNER_TEMP/report-preview" --as-of 2026-11-06 --tickers CSCO JPM --output "$RUNNER_TEMP/scoped-news-fixture"
      - uses: actions/upload-artifact@v6
        with:
          name: scoped-news-fixture-${{ matrix.python }}
          path: ${{ runner.temp }}/scoped-news-fixture
          retention-days: 14

      - name: Build eight sector brief drafts and verify four-page structure
        run: python scripts/sector_briefs.py --store "$RUNNER_TEMP/report-preview" --as-of 2026-11-06 --boc-capture tests/fixtures/boc_fxusdcad_20261102_20261106.json --output "$RUNNER_TEMP/sector-briefs"
      - uses: actions/upload-artifact@v6
        with:
          name: sector-brief-drafts-${{ matrix.python }}
          path: ${{ runner.temp }}/sector-briefs
          retention-days: 14
      - name: Build and validate standalone macro overview draft
        run: python scripts/macro_overview.py --store "$RUNNER_TEMP/report-preview" --as-of 2026-11-06 --boc-capture tests/fixtures/boc_fxusdcad_20261102_20261106.json --output "$RUNNER_TEMP/macro-overview"
      - uses: actions/upload-artifact@v6
        with:
          name: macro-overview-draft-${{ matrix.python }}
          path: ${{ runner.temp }}/macro-overview
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Build the historical research workspace
        run: |
          python scripts/import_history.py --reports reports --store "$RUNNER_TEMP/browser-store"
          # Synthetic browser cases: repeated history and an issuer correction.
          PYTHONPATH=scripts python - <<'PYCODE'
          from copy import deepcopy
          from datetime import datetime, timedelta
          import os
          from pathlib import Path
          import shutil
          from report_store import read_json, write_json
          root = Path(os.environ['RUNNER_TEMP']) / 'browser-store'
          index = read_json(root / 'index.json')
          original = next(entry for entry in index['reports'] if entry['ticker'] == 'CSCO')
          replay = deepcopy(original)
          replay['report_id'] = 'browser-history-replay/CSCO'
          replay['generated_at'] = (datetime.fromisoformat(original['generated_at']) + timedelta(seconds=1)).isoformat()
          for kind in ('md', 'json', 'pdf'):
              target = Path('archive/browser-history-replay/CSCO') / Path(original[kind]).name
              (root / target).parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / original[kind], root / target)
              replay[kind] = target.as_posix()
          index['reports'].append(replay)
          magna = next(entry for entry in index['reports'] if entry['ticker'] == 'MG.TO')
          write_json(root / Path(magna['json']).parent / 'sources/mg.to-edgar.json', {'cik': '1436126'})
          write_json(root / 'index.json', index)
          PYCODE
          python scripts/build_site.py --store "$RUNNER_TEMP/browser-store" --output site-browser
      - name: Exercise desktop and mobile member workflows
        run: python scripts/browser_smoke.py --site site-browser --artifacts review/browser
      - name: Exercise subscription portal with isolated Auth and RPC fixtures
        run: python scripts/subscription_browser_smoke.py --site site-browser --artifacts review/subscription-browser
      - name: Exercise shared research archive views
        run: python scripts/research_browser_smoke.py --site site-browser --artifacts review/shared-research
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-acceptance
          path: |
            review/browser
            review/subscription-browser
            review/shared-research
          retention-days: 14

  subscription-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-test-password
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v6
      - name: Verify subscription permissions and snapshot contract
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/subscription_authority.sql
      - name: Verify concurrent preference updates
        run: python tests/sql/concurrent_subscriptions.py
      - name: Verify administrator and member concurrency
        run: python tests/sql/concurrent_administration.py
      - name: Verify private migration reviews in a separate disposable database
        run: |
          createdb subscription_migration_review
          PGDATABASE=subscription_migration_review PYTHONPATH=scripts python tests/sql/migration_review.py
