name: JSOSIF Test Send (One-time Noon Test)

on:
  schedule:
    # 12:00 EDT = 16:00 UTC, one-time test on 2026-10-15
    - cron: '0 16 15 10 *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm test send'
        required: true
        default: 'NO'

jobs:
  test-send:
    runs-on: ubuntu-latest
    # Only run on 2026-10-15 (one-time test guard)
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 16 15 10 *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify test date (one-time guard)
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ "$TODAY" != "2026-10-15" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not 2026-10-15, skipping one-time test"
            exit 1
          fi
          echo "Date check passed: $TODAY"

      - name: Generate fresh reports (5 tickers, real-time data)
        run: |
          set -o pipefail
          cd ${{ github.workspace }}
          # Run pipeline steps for the 5 test tickers to fetch real-time data
          for ticker in CNQ.TO CSCO JPM BMO.TO COST; do
            for script in quant ai_extract comparables earnings edgar regenerate_report report_pdf; do
              echo "RUN $ticker $script"
              python scripts/${script}.py --ticker "$ticker" 2>&1 | tail -20
            done
          done
          # Verify fresh reports+PDFs were generated today (fail closed, never send stale)
          TODAY=$(date -u +%Y%m%d)
          MISSING=0
          for ticker in CNQ.TO CSCO JPM BMO.TO COST; do
            if [ ! -f "reports/${ticker}-intelligence-${TODAY}.md" ]; then
              echo "MISSING md: $ticker"; MISSING=1
            fi
            if [ ! -f "reports/${ticker}-intelligence-${TODAY}.pdf" ]; then
              echo "MISSING pdf: $ticker"; MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "ERROR: Not all fresh reports generated for $TODAY. Refusing to send stale."
            ls -la reports/*-intelligence-${TODAY}.md reports/*-intelligence-${TODAY}.pdf || true
            exit 1
          fi
          echo "Fresh reports verified for all 5 tickers: CNQ.TO CSCO JPM BMO.TO COST"
        continue-on-error: false

      - name: Send test emails
        env:
          JSOSIF_APPROVED_SEND: '1'
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          set -o pipefail
          cd ${{ github.workspace }}
          # Write Gmail config from secrets (not committed to repo)
          mkdir -p config
          cat > config/gmail.json <<EOF
          {
            "address": "${GMAIL_USER}",
            "app_password": "${GMAIL_APP_PASSWORD}"
          }
          EOF
          chmod 600 config/gmail.json
          # Write recipients to temp JSON file (--recipients takes a file path)
          # Later test rounds: only zhou6u@uwindsor.ca (per Lucas 2026-10-15)
          cat > /tmp/recipients.json <<EOF
          {"recipients": ["zhou6u@uwindsor.ca"]}
          EOF
          # Send the 5 fresh reports (PDFs attached) to the test recipient.
          # One email, brief cover-note body (greeting + report list + sign-off).
          TODAY=$(date -u +%Y%m%d)
          MDS=""
          PDFS=""
          for ticker in CNQ.TO CSCO JPM BMO.TO COST; do
            MDS="$MDS reports/${ticker}-intelligence-${TODAY}.md"
            PDFS="$PDFS reports/${ticker}-intelligence-${TODAY}.pdf"
          done
          for f in $MDS $PDFS; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Fresh report $f not found. Refusing to send."
              exit 1
            fi
          done
          echo "Sending 5 reports: $MDS"
          python scripts/email_delivery.py $MDS \
            --recipients /tmp/recipients.json \
            --brief --pdf $PDFS \
            --send
          SEND_RC=$?
          # Clean up credentials immediately
          shred -u config/gmail.json || rm -f config/gmail.json
          rm -f /tmp/recipients.json
          exit $SEND_RC

      - name: Report results
        if: always()
        run: |
          echo "Test send completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "Check Gmail sent folder and recipient inboxes for verification"
