name: Weekly member PDF delivery

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: ['Daily production research pipeline']
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to enable real delivery for this manual run; otherwise preview counts only'
        required: true
        default: 'NO'

permissions:
  contents: write

jobs:
  deliver:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.EMAIL_DELIVERY_ENABLED == 'true') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["schedule","workflow_dispatch"]'), github.event.workflow_run.event)))
    concurrency:
      group: jsosif-email-delivery
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.lock
      - name: Load and validate private member configuration
        id: members
        env:
          SUBSCRIPTIONS_JSON: ${{ secrets.SUBSCRIPTIONS_JSON }}
          MEMBERS_CSV: ${{ secrets.MEMBERS_CSV }}
        run: python scripts/prepare_subscriptions.py "$RUNNER_TEMP/subscriptions.json"
      - name: Wait for the reviewed roster
        if: steps.members.outputs.email_members == '0'
        run: echo 'No enabled members loaded; no email delivery attempted.' >> "$GITHUB_STEP_SUMMARY"
      - name: Open the immutable report archive
        if: steps.members.outputs.email_members != '0' && steps.members.outputs.configured == 'true'
        run: python scripts/prepare_store.py ../report-store
      - name: Open the independent delivery ledger
        id: ledger
        if: steps.members.outputs.email_members != '0' && steps.members.outputs.configured == 'true'
        run: python scripts/prepare_delivery_store.py ../delivery-store --archive ../report-store
      - name: Send due weekly PDF digests or show preview counts
        if: steps.members.outputs.email_members != '0' && steps.members.outputs.configured == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JSOSIF_APPROVED_SEND: '1'
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          MODE=()
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_run ] || [ "$CONFIRM" = YES ]; then
            MODE=(--send)
          fi
          python scripts/deliver_weekly.py --config "$RUNNER_TEMP/subscriptions.json" --store ../report-store --ledger-store ../delivery-store --persist-git "${MODE[@]}"
      - name: Stage hashed delivery state for backup
        if: always() && steps.ledger.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/delivery-state-backup"
          cp ../delivery-store/state/deliveries.json ../delivery-store/state/migration.json "$RUNNER_TEMP/delivery-state-backup/"
      - name: Back up hashed delivery state
        if: always() && steps.ledger.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: delivery-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/delivery-state-backup/
          if-no-files-found: error
          retention-days: 30
      - name: Remove private configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/subscriptions.json"
